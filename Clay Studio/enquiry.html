<main>
  <section class="page-hero">
    <h1>Make an Enquiry</h1>
    <p>Interested in a piece, selling your clay work, or booking a pottery class? Tell us more below.</p>
  </section>

  <section class="page-section">
    <form id="enquiry-form" novalidate>
      <div>
        <label for="e-name">Name</label>
        <input type="text" id="e-name" name="name" required>
      </div>
      <div>
        <label for="e-email">Email</label>
        <input type="email" id="e-email" name="email" required>
      </div>
      <div>
        <label for="e-type">I'm enquiring about</label>
        <select id="e-type" name="type" required>
          <option value="">Select an option</option>
          <option value="product">A product / item</option>
          <option value="custom">A custom commission</option>
          <option value="class">Booking a pottery class</option>
          <option value="selling">Selling my clay work</option>
          <option value="other">Something else</option>
        </select>
      </div>
      <div>
        <label for="e-item">Item / Class of Interest</label>
        <input type="text" id="e-item" name="item" placeholder="e.g. Speckled Bud Vase, Beginner Wheel Class">
      </div>
      <div>
        <label for="e-message">Message</label>
        <textarea id="e-message" name="message" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Submit Enquiry</button>
    </form>
    <div id="enquiry-response" class="form-response top" aria-live="polite"></div>
  </section>
</main>
