      <ul>

<main>
  <section class="page-hero">
    <h1>Sell Your Clay With Us</h1>
    <p>Upload a photo, add a title, and set your price.</p>
  </section>

  <section class="page-section">
    <form id="sell-form" class="sell-layout">

      <!-- LEFT: upload box -->
      <div class="upload-box">
        <label for="s-photo" class="upload-label" id="upload-label">
          <div class="upload-icon">&#128247;</div>
          <p class="upload-title">Upload your photo</p>
          <p class="upload-sub">Click to choose a file<br>JPG, PNG up to 20MB</p>
        </label>
        <input type="file" id="s-photo" name="photo" accept="image/*" required class="upload-input">
        <img id="photo-preview" class="photo-preview" alt="Preview of your photo">
      </div>

      
      <div class="sell-fields">
        <div>
          <label for="s-title">Title of Design</label>
          <input type="text" id="s-title" name="title" placeholder="Tell everyone what your piece is about" required>
        </div>

        <div>
          <label for="s-price">Price (ZAR)</label>
          <input type="number" id="s-price" name="price" min="0" step="1" placeholder="e.g. 250" required>
        </div>

        <div>
          <label for="s-category">Category</label>
          <select id="s-category" name="category" required>
            <option value="">Select a category</option>
            <option value="cute-clay">Cute Clay</option>
            <option value="cups">Cups</option>
            <option value="necklaces">Necklaces</option>
            <option value="vases">Vases</option>
            <option value="bagcharms">Bag Charms</option>
            <option value="more-clay">More Clay</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Post to Shop</button>
      </div>

    </form>
    <div id="sell-response" class="form-response" aria-live="polite"></div>
  </section>
</main>

</body>
</html>
